[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-pipeline"
version = "0.1.0"
description = "Public video utilities with private-data-aware validation"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
ai-video-check-metadata = "ai_video.metadata:main"

[tool.setuptools.packages.find]
where = ["src"]
