name: Check private metadata syntax
on:
  workflow_dispatch:
  # One-time owner-authorized configuration verification; removed after this run.
  push:
    branches: [main]
    paths: ['.github/workflows/private-check.yml']
permissions:
  contents: read
concurrency:
  group: private-metadata-check
  cancel-in-progress: false
jobs:
  check:
    if: >-
      github.event.repository.private == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        github.event.head_commit.message == 'chore: verify Agnes read-only authentication'))
    environment: private-assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check public source boundary
        run: python3 scripts/public_boundary.py
      - name: Verify configured secret availability without revealing values
        env:
          ASSETS_REPOSITORY: ${{ secrets.ASSETS_REPOSITORY }}
          ASSETS_PAT: ${{ secrets.ASSETS_PAT }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          python3 -I - <<'PY'
          import os
          import sys
          names = ("ASSETS_REPOSITORY", "ASSETS_PAT", "AGNES_API_KEY")
          failed = False
          for name in names:
              value = os.environ.get(name, "")
              valid = bool(value) and value == value.strip() and not any(c in value for c in "\r\n\0")
              print(name + (": available" if valid else ": missing or malformed"))
              failed = failed or not valid
          print("Availability only: Agnes service authentication and generation are not tested.")
          sys.exit(1 if failed else 0)
          PY
      - name: Install only public code without shared caches
        run: |
          python3 -m venv "$RUNNER_TEMP/private-check-venv"
          "$RUNNER_TEMP/private-check-venv/bin/python" -m pip install --no-cache-dir .
      - name: Read private metadata with a read-only token
        env:
          ASSETS_REPOSITORY: ${{ secrets.ASSETS_REPOSITORY }}
          ASSETS_PAT: ${{ secrets.ASSETS_PAT }}
        run: |
          "$RUNNER_TEMP/private-check-venv/bin/python" scripts/private_check.py
      - name: Probe Agnes authentication using read-only GET without generation
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          ENDPOINT = "https://apihub.agnes-ai.com/v1/models"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def probe(credential):
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
              request = urllib.request.Request(ENDPOINT, method="GET", headers={
                  "Authorization": "Bearer " + credential,
                  "Accept": "application/json",
                  "User-Agent": "ai-video-pipeline-readonly-verification",
              })
              try:
                  with opener.open(request, timeout=30) as response:
                      status = response.status
                      if response.geturl() != ENDPOINT:
                          return 0, False
                      body = response.read(1_048_577)
                      if len(body) > 1_048_576:
                          return status, False
                      try:
                          parsed = json.loads(body)
                      except (ValueError, UnicodeError):
                          return status, False
                      is_catalog = isinstance(parsed, dict) and isinstance(parsed.get("data"), list)
                      return status, is_catalog
              except urllib.error.HTTPError as error:
                  status = error.code
                  error.close()
                  return status, False
              except Exception:
                  return 0, False

          def classify(control_status, actual_status, catalog):
              if actual_status in (401, 403):
                  return "rejected", 1
              if control_status in (401, 403) and actual_status == 200 and catalog:
                  return "verified", 0
              return "inconclusive", 2

          key = os.environ.pop("AGNES_API_KEY", "")
          if not key or key != key.strip() or any(c in key for c in "\r\n\0"):
              print("AGNES_AUTH: missing or malformed credential; no request sent.")
              sys.exit(1)
          # A fixed invalid credential is a negative control, not another account.
          control_status, _ = probe("configuration-verification-invalid-credential")
          actual_status, catalog = probe(key)
          key = ""
          result, code = classify(control_status, actual_status, catalog)
          print("AGNES_AUTH_NEGATIVE_CONTROL_HTTP: " + str(control_status))
          print("AGNES_AUTH_CONFIGURED_KEY_HTTP: " + str(actual_status))
          print("AGNES_AUTH_RESULT: " + result)
          print("Scope: read-only model-catalog authentication probe; no image/video generation.")
          if result == "inconclusive":
              print("This endpoint did not establish authentication; do not infer that the key is invalid.")
          sys.exit(code)
          PY
