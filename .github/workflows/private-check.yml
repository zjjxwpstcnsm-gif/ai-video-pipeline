name: Check private metadata syntax
on:
  workflow_dispatch:
  # One-time owner-authorized configuration verification; removed after this run.
  push:
    branches: [main]
    paths: ['.github/workflows/private-check.yml']
permissions:
  contents: read
concurrency:
  group: private-metadata-check
  cancel-in-progress: false
jobs:
  check:
    if: >-
      github.event.repository.private == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        github.event.head_commit.message == 'chore: verify configured private-assets secrets'))
    environment: private-assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check public source boundary
        run: python3 scripts/public_boundary.py
      - name: Verify configured secret availability without revealing values
        env:
          ASSETS_REPOSITORY: ${{ secrets.ASSETS_REPOSITORY }}
          ASSETS_PAT: ${{ secrets.ASSETS_PAT }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          python3 -I - <<'PY'
          import os
          import sys
          names = ("ASSETS_REPOSITORY", "ASSETS_PAT", "AGNES_API_KEY")
          failed = False
          for name in names:
              value = os.environ.get(name, "")
              valid = bool(value) and value == value.strip() and not any(c in value for c in "\r\n\0")
              print(name + (": available" if valid else ": missing or malformed"))
              failed = failed or not valid
          print("Availability only: Agnes service authentication and generation are not tested.")
          sys.exit(1 if failed else 0)
          PY
      - name: Install only public code without shared caches
        run: |
          python3 -m venv "$RUNNER_TEMP/private-check-venv"
          "$RUNNER_TEMP/private-check-venv/bin/python" -m pip install --no-cache-dir .
      - name: Read private metadata with a read-only token
        env:
          ASSETS_REPOSITORY: ${{ secrets.ASSETS_REPOSITORY }}
          ASSETS_PAT: ${{ secrets.ASSETS_PAT }}
        run: |
          "$RUNNER_TEMP/private-check-venv/bin/python" scripts/private_check.py
