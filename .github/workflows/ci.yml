name: Public pipeline CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check public source boundary
        run: python3 scripts/public_boundary.py
      - name: Install public package
        run: |
          python3 -m venv "$RUNNER_TEMP/pipeline-venv"
          "$RUNNER_TEMP/pipeline-venv/bin/python" -m pip install --no-cache-dir .
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Run offline tests and synthetic media smoke test
        env:
          REQUIRE_FFMPEG: '1'
        run: |
          "$RUNNER_TEMP/pipeline-venv/bin/python" -m unittest discover -s tests -v
          "$RUNNER_TEMP/pipeline-venv/bin/python" -m compileall -q src scripts
