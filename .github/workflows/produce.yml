name: Produce private media
on:
  push:
    branches: [main]
    paths: [requests/current.txt]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-production
  cancel-in-progress: false
jobs:
  produce:
    if: >-
      github.event.repository.private == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    environment: private-assets
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check public source boundary
        run: python3 scripts/public_boundary.py
      - name: Install image decoder
        run: python3 -m pip install --no-cache-dir 'Pillow>=11,<13'
      - name: Produce and preserve private results
        env:
          ASSETS_REPOSITORY: ${{ secrets.ASSETS_REPOSITORY }}
          ASSETS_PAT: ${{ secrets.ASSETS_PAT }}
          RESULTS_PAT: ${{ secrets.RESULTS_PAT }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: python3 scripts/produce.py
